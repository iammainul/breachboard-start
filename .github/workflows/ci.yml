name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    name: Lint, test, and build
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://ttx:ttx@127.0.0.1:5432/ttx
      AUTH_SECRET: ci-auth-secret-not-for-production
      AUTH_URL: http://localhost:3000
      OPERATOR_EMAIL: operator@local
      OPERATOR_PASSWORD: change-me
      ALLOW_DEV_DEFAULTS: "true"
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Typecheck
        run: npx tsc --noEmit

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t breachboard:ci .

  e2e:
    name: Playwright e2e
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ttx
          POSTGRES_PASSWORD: ttx
          POSTGRES_DB: ttx
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ttx -d ttx"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://ttx:ttx@127.0.0.1:5432/ttx?connection_limit=20&pool_timeout=10
      AUTH_SECRET: ci-auth-secret-not-for-production
      AUTH_URL: http://localhost:3010
      OPERATOR_EMAIL: operator@local
      OPERATOR_PASSWORD: change-me
      ALLOW_DEV_DEFAULTS: "true"
      PLAYWRIGHT_PORT: "3010"
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Seed DEMO01
        run: npx tsx scripts/reseed-demo.ts

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Production build
        run: npm run build

      - name: Run Playwright
        run: npm run test:e2e

      - name: Upload report and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
